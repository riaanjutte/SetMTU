[package]
name = "setmtu"
version = "0.1.1"
edition = "2024"
description = "Windows utility to set a network interface's MTU (1428 by default), with one-click restore"
license = "MIT"
repository = "https://github.com/riaanjutte/SetMTU"
publish = false

[dependencies]
eframe = "0.36.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security", "Win32_System_Registry", "Win32_System_SystemInformation"] }

[build-dependencies]
winresource = "0.1.31"

# Smaller release exe: whole-program optimisation and no symbol tables.
[profile.release]
lto = true
codegen-units = 1
strip = true
