ShortDescription: Set a network interface's MTU (1428 by default) and restore the original with one click.
Description: |-
  SetMTU is a small utility that sets the IP MTU (Maximum Transmission Unit) of a network interface.
  The Windows default of 1500 bytes is too large for many PPPoE, fibre and VPN links, which shows up as stalled page loads, slow transfers or dropped calls.
  SetMTU lists your adapters, picks the busiest one, shows the exact netsh commands before running them, and saves the original values so Restore puts them back.
  Changes need administrator approval (UAC) and persist across restarts.
